name: Build Android APKs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Clean Native Directories
        run: rm -rf android ios

      - name: Prebuild Native Android
        run: npx expo prebuild --clean --platform android

      - name: Enable Architecture Splitting
        run: |
          echo "android.enableSeparateBuildPerCPUArchitecture=true" >> android/gradle.properties

      - name: Initialize EAS Project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas init --account devjay_21 --non-interactive

      - name: Build Split APKs via EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build -p android --profile preview --non-interactive
