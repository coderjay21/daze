name: Build Split Android APKs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Native Android Directory
        run: npx expo prebuild --platform android --clean

      - name: Enable Architecture Splitting
        run: |
          echo "android.enableSeparateBuildPerCPUArchitecture=true" >> android/gradle.properties

      - name: Build Split Release APKs
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload arm64-v8a APK (Fast & Light ~25MB)
        uses: actions/upload-artifact@v4
        with:
          name: daze-arm64-v8a-apk
          path: android/app/build/outputs/apk/release/*arm64-v8a*.apk
