name: Build Split Android APKs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Clean Native Directories
        run: rm -rf android ios

      - name: Prebuild Native Android
        run: npx expo prebuild --clean --platform android

      - name: Fix Reanimated Node Path & Split ABI in Gradle
        run: |
          NODE_PATH=$(which node)
          echo "export NODE_BINARY=$NODE_PATH" > android/.env
          echo "NODE_BINARY=$NODE_PATH" >> android/gradle.properties
          echo "android.enableSeparateBuildPerCPUArchitecture=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties
          echo "reactNativeArchitectures=arm64-v8a,armeabi-v7a,x86,x86_64" >> android/gradle.properties
          sudo ln -sf $NODE_PATH /usr/bin/node
          sudo ln -sf $NODE_PATH /usr/local/bin/node

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Split APKs with Gradle
        working-directory: android
        env:
          NODE_BINARY: /usr/bin/node
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.logging.level=lifecycle

      - name: Collect Generated Split APKs
        run: |
          mkdir -p build-apks
          find android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -lh build-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daze-split-apks
          path: build-apks/*.apk
          retention-days: 7
