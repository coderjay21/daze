name: Build Split Android APKs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Native Android Directory
        run: npx expo prebuild --platform android --clean

      - name: Configure Gradle Environment
        run: |
          echo "android.enableSeparateBuildPerCPUArchitecture=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

      - name: Build Split Release APKs
        working-directory: android
        env:
          NODE_BINARY: node
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Upload arm64-v8a APK (Lightweight ~25-30MB)
        uses: actions/upload-artifact@v4
        with:
          name: daze-arm64-v8a-apk
          path: android/app/build/outputs/apk/release/*arm64-v8a*.apk
