name: Build Split Android APKs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Clean Native Directories
        run: rm -rf android ios

      - name: Prebuild Native Android
        run: npx expo prebuild --clean --platform android

      - name: Enable Architecture Splitting & Optimizations
        run: |
          echo "android.enableSeparateBuildPerCPUArchitecture=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Split APKs with Gradle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Organize & Rename Generated APKs
        run: |
          mkdir -p build-apks
          find android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -lh build-apks/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daze-split-apks
          path: build-apks/*.apk
          retention-days: 7
